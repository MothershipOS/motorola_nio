# mothershipOS (nio host): modules udev must not autoload. These drive blocks whose access at EL2
# (without ADSP / TZ-owned crypto) is unverified and may hang the bus; load by hand when bringing them up.
blacklist snd_soc_lpass_va_macro
blacklist pinctrl_sm8250_lpass_lpi
blacklist qcrypto
blacklist icc_bwmon
