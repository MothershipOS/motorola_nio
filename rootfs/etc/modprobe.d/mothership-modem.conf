# The nio's SDX55 (modem on PCIe2, no flash): the host serves its boot chain over Sahara (mhi_sahara, kernel
# patch 0027) from /lib/firmware/qcom/sdx55m (the stock modem partition's image/sdx55m) and its NV/EFS raw from
# the phone's own partitions (mdm1m9kefs3 exists per slot here, both copies alike).
options mhi_sahara images=4:apps.mbn,6:apps.mbn,8:qdsp6sw.mbn,12:qdsp6sw.mbn,16:@/dev/disk/by-partlabel/mdm1m9kefs1,17:@/dev/disk/by-partlabel/mdm1m9kefs2,20:@/dev/disk/by-partlabel/mdm1m9kefs3_a,23:aop.mbn,25:tz.mbn,26:=zero:512,29:acdb.mbn,33:hyp.mbn,34:mdmddr.mbn,36:multi_image_qti.mbn,37:multi_image.mbn,38:xbl_cfg.elf,39:apps.mbn,40:apdp.mbn,41:devcfg.mbn,42:sec.elf
